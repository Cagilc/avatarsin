<script type="module">
import * as THREE from 'three';
import { GLTFExporter } from 'three/addons/exporters/GLTFExporter.js';
import { createVex } from '/vex3d.js';
window.exportGLB = async () => {
  const vex = createVex(THREE);
  vex.setPose('idle', true); vex.update(0.016, 0);
  vex.pivots.forEach((p) => p.parent.remove(p));
  const scene = new THREE.Scene(); scene.name = 'Vex'; scene.add(vex.root);
  const clips = vex.buildClips();
  const buf = await new GLTFExporter().parseAsync(scene, { binary: true, animations: clips, onlyVisible: false, maxTextureSize: 512 });
  const bytes = new Uint8Array(buf); let s = ''; for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return { b64: btoa(s), clips: clips.map((c) => c.name + ' ' + c.duration.toFixed(1) + 's') };
};
window.ready = true;
</script>
